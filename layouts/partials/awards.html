<ul class="award-list">{{ range hugo.Data.awards }}<li><span class="record-year">{{ .year }}{{ if $.ja }}年{{ end }}</span><div>{{ if $.ja }}<a href="{{ .url_ja }}"><strong>{{ .name_ja }}</strong></a><br>{{ .event_ja }}{{ else }}<a href="{{ .url }}"><strong>{{ .name }}</strong></a>{{ with .url_language }} <span>({{ . }})</span>{{ end }}<br>{{ .event }}{{ end }}</div></li>{{ end }}</ul>
