<header class="header">
  <div class="header__inner">
    <a class="header__logo" href="{{ "/" | relURL }}" aria-label="Huimin Li — Home"><span class="header__logo-text">Huimin Li</span></a>
    <nav class="nav" aria-label="{{ if eq .Params.pageLanguage "ja" }}メインナビゲーション{{ else }}Main navigation{{ end }}">
      {{ range .Site.Menus.main }}<a class="nav__link{{ if eq $.RelPermalink .URL }} nav__link--active{{ end }}" href="{{ .URL | relURL }}"{{ if eq $.RelPermalink .URL }} aria-current="page"{{ end }}{{ if eq .Name "日本語" }} lang="ja" hreflang="ja"{{ end }}>{{ .Name }}</a>{{ end }}
    </nav>
    <button class="menu-toggle" id="menu-toggle" aria-label="{{ if eq .Params.pageLanguage "ja" }}メニューを開く{{ else }}Open menu{{ end }}" aria-expanded="false" aria-controls="mobile-menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
</header>
